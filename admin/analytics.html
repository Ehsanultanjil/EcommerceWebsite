<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Analytics — NOVA Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/css/variables.css" />
<link rel="stylesheet" href="../assets/css/base.css" />
<link rel="stylesheet" href="../assets/css/components.css" />
<link rel="stylesheet" href="../assets/css/admin.css" />
<link rel="stylesheet" href="../assets/css/category-breakdown.css" />
</head>
<body class="admin-body">

<div id="admin-sidebar-root"></div>

<main class="admin-main">
  <div class="admin-topbar">
    <div>
      <h1>Analytics</h1>
      <p class="text-secondary">Performance across your store.</p>
    </div>
  </div>

  <div class="stat-grid" id="analytics-stat-grid"></div>

  <div class="card chart-card">
    <div class="chart-card-head">
      <h3>Revenue Trend</h3>
      <span class="badge badge-neutral">Last 12 months</span>
    </div>
    <div id="analytics-chart-root"></div>
    <div class="chart-axis-labels" id="analytics-chart-labels"></div>
  </div>

  <div class="card chart-card">
    <h3 style="margin-bottom:20px">Sales by Category</h3>
    <div id="category-breakdown"></div>
  </div>
</main>

<script src="../assets/js/utils/storage.js"></script>
<script src="../assets/js/utils/format.js"></script>
<script src="../assets/js/data/products.js"></script>
<script src="../assets/js/data/categories.js"></script>
<script src="../assets/js/data/admin-data.js"></script>
<script src="../assets/js/components/admin-sidebar.js"></script>
<script src="../assets/js/components/admin-chart.js"></script>
<script src="../assets/js/pages/admin-analytics.js"></script>
</body>
</html>
