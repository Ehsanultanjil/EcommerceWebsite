<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Add/Edit Product — BARAZ Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/css/variables.css" />
<link rel="stylesheet" href="../assets/css/base.css" />
<link rel="stylesheet" href="../assets/css/components.css" />
<link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body class="admin-body">

<div id="admin-sidebar-root"></div>

<main class="admin-main">
  <div class="admin-topbar">
    <div>
      <h1 id="edit-page-title">Add Product</h1>
      <p class="text-secondary">Products / <span id="edit-page-subtitle">New</span></p>
    </div>
    <a href="products.html" class="btn btn-outline">Cancel</a>
  </div>

  <form id="product-edit-form" class="admin-form-grid">
    <div class="card admin-form-card">
      <h3>Product Details</h3>
      <div class="field"><label>Product Name</label><input class="input" name="name" id="field-name" required /></div>
      <div class="form-row">
        <div class="field">
          <label>Category</label>
          <select class="select" name="category" id="field-category" required></select>
        </div>
        <div class="field"><label>Price</label><input class="input" type="number" step="0.01" min="0" name="price" id="field-price" required /></div>
      </div>
      <div class="form-row">
        <div class="field"><label>Sale Price (optional)</label><input class="input" type="number" step="0.01" min="0" name="originalPrice" id="field-original-price" /></div>
        <div class="field"><label>Stock</label><input class="input" type="number" step="1" min="0" name="stock" id="field-stock" required /></div>
      </div>
      <div class="field"><label>Colors (comma separated, display only)</label><input class="input" name="colors" id="field-colors" placeholder="Black, Silver" /></div>
      <div class="field"><label>Description</label><textarea class="textarea" name="desc" id="field-desc" required></textarea></div>
      <label class="checkbox-row"><input type="checkbox" name="isNew" id="field-isnew" /> Mark as New Arrival</label>
    </div>

    <div class="card admin-form-card">
      <h3>Image</h3>
      <div class="image-upload-box"><img id="image-preview" src="" alt="Preview" /></div>
      <div class="field"><label>Image URL</label><input class="input" name="image" id="field-image" required /></div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px">Save Product</button>
    </div>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/utils/storage.js"></script>
<script src="../assets/js/utils/format.js"></script>
<script src="../assets/js/utils/auth.js"></script>
<script src="../assets/js/components/toast.js"></script>
<script src="../assets/js/utils/api.js"></script>
<script src="../assets/js/components/modal.js"></script>
<script src="../assets/js/components/admin-sidebar.js"></script>
<script src="../assets/js/pages/admin-product-edit.js"></script>
</body>
</html>
