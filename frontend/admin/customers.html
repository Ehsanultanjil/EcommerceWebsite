<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Customers — BARAZ Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/css/variables.css" />
<link rel="stylesheet" href="../assets/css/base.css" />
<link rel="stylesheet" href="../assets/css/components.css" />
<link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body class="admin-body">

<div id="admin-sidebar-root"></div>

<main class="admin-main">
  <div class="admin-topbar">
    <div>
      <h1>Customers</h1>
      <p class="text-secondary" id="customers-count-label"></p>
    </div>
  </div>

  <div class="admin-toolbar">
    <div class="admin-toolbar-left">
      <input type="text" class="input admin-search-input" id="customer-search" placeholder="Search customers..." />
    </div>
  </div>

  <div class="card admin-table-card">
    <table class="admin-table">
      <thead>
        <tr><th>Customer</th><th>Orders</th><th>Total Spent</th><th>Joined</th></tr>
      </thead>
      <tbody id="customers-table-body"></tbody>
    </table>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/utils/storage.js"></script>
<script src="../assets/js/utils/format.js"></script>
<script src="../assets/js/utils/auth.js"></script>
<script src="../assets/js/components/toast.js"></script>
<script src="../assets/js/utils/api.js"></script>
<script src="../assets/js/data/admin-data.js"></script>
<script src="../assets/js/components/admin-sidebar.js"></script>
<script src="../assets/js/pages/admin-customers.js"></script>
</body>
</html>
