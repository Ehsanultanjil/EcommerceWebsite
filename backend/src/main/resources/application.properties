spring.application.name=nova-backend
server.port=8080

# Supabase PostgreSQL connection — values come from environment variables only.
# See .env.example for the required variable names.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema already exists and is managed by Supabase CLI migrations (see /supabase/migrations).
# Hibernate must never create/alter it — 'validate' checks entity mappings match the real
# schema at startup and fails fast on mismatch, without ever issuing DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# CORS: comma-separated allowed origins. The current frontend is served statically
# (Python http.server) on 5500; common React dev server ports are included ahead of
# the migration. Add the Vercel URL here when it exists — no code change needed.
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:5173

# Supabase Auth issues JWTs signed with an asymmetric key (ES256) — verified here via
# its public JWKS endpoint, so no shared secret is ever stored in this service.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_URL}/auth/v1/.well-known/jwks.json
