spring.application.name=nova-backend
# Render (and most PaaS hosts) inject PORT and expect the app to bind to it;
# defaults to 8080 for local dev where PORT isn't set.
server.port=${PORT:8080}

# Supabase PostgreSQL connection — values come from environment variables only.
# See .env.example for the required variable names.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Supabase's SESSION pooler caps the whole project at 15 concurrent client
# connections — shared across every environment (local dev, Render, anything
# else) hitting this database. Hikari's default max (10) per instance can
# exhaust that alone; keeping each instance small leaves room for more than
# one environment to run at the same time without one locking the other out.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=2

# Schema already exists and is managed by Supabase CLI migrations (see /supabase/migrations).
# Hibernate must never create/alter it — 'validate' checks entity mappings match the real
# schema at startup and fails fast on mismatch, without ever issuing DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# CORS: comma-separated allowed origins. Overridable via the CORS_ALLOWED_ORIGINS env
# var (e.g. on Render) without a code change — defaults cover local dev only.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:5173}

# Supabase Auth issues JWTs signed with an asymmetric key (ES256) — verified here via
# its public JWKS endpoint, so no shared secret is ever stored in this service.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_URL}/auth/v1/.well-known/jwks.json
