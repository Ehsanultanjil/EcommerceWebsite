<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In — NOVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/variables.css" />
<link rel="stylesheet" href="assets/css/base.css" />
<link rel="stylesheet" href="assets/css/components.css" />
<link rel="stylesheet" href="assets/css/navbar.css" />
<link rel="stylesheet" href="assets/css/footer.css" />
<link rel="stylesheet" href="assets/css/auth.css" />
</head>
<body>

<div id="navbar-root"></div>

<main class="page-body auth-page">
  <div class="auth-card card card-pad">
    <div class="navbar-logo auth-logo">NOVA</div>
    <h1>Welcome back</h1>
    <p class="text-secondary">Sign in to continue to your account.</p>

    <form id="login-form" class="auth-form">
      <div class="field"><label>Email</label><input class="input" type="email" name="email" required /></div>
      <div class="field"><label>Password</label><input class="input" type="password" name="password" required minlength="4" /></div>
      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>

    <p class="auth-switch">Don't have an account? <a href="register.html">Create one</a></p>
  </div>
</main>

<div id="footer-root"></div>

<script src="assets/js/utils/storage.js"></script>
<script src="assets/js/utils/format.js"></script>
<script src="assets/js/data/products.js"></script>
<script src="assets/js/components/toast.js"></script>
<script src="assets/js/components/modal.js"></script>
<script src="assets/js/components/navbar.js"></script>
<script src="assets/js/components/search.js"></script>
<script src="assets/js/components/footer.js"></script>
<script src="assets/js/pages/auth.js"></script>
</body>
</html>
